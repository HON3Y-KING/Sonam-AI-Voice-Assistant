name: Build Sonam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract Sonam project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No Sonam ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

          ROOT=$(find project -name settings.gradle.kts -type f -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found."
            exit 1
          fi

          echo "Project root: $ROOT"

          mkdir -p project_final
          cp -a "$ROOT"/. project_final/

      - name: Fix Java and Kotlin targets
        working-directory: project_final
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s += '''

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          '''

          if "jvmToolchain(17)" not in s:
              s += '''

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project_final
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonam-Gemini-debug-apk
          path: project_final/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
