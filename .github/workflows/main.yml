namename: Build Sonam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q Sonam-AI-Voice-Assistant-starter.zip -d project

      - name: Fix Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/src/main/java/com/sonam/assistant/NeonView.kt")

          p.write_text(r'''package com.sonam.assistant

import android.content.Context
import android.graphics.Canvas
import android.graphics.Color
import android.graphics.Paint
import android.util.AttributeSet
import android.view.View
import kotlin.math.sin

class NeonView @JvmOverloads constructor(
    context: Context,
    attrs: AttributeSet? = null,
    defStyleAttr: Int = 0
) : View(context, attrs, defStyleAttr) {

    private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
    private var t = 0f

    init {
        setLayerType(View.LAYER_TYPE_SOFTWARE, null)
    }

    override fun onDraw(canvas: Canvas) {
        super.onDraw(canvas)
        canvas.drawColor(Color.rgb(5, 5, 9))

        val cx = width / 2f
        val cy = height / 2f
        val pulse = 1f + 0.06f * sin(t.toDouble()).toFloat()
        val radius = minOf(width, height) * 0.24f * pulse

        paint.style = Paint.Style.STROKE
        paint.strokeWidth = 10f
        paint.color = Color.rgb(80, 180, 255)
        paint.setShadowLayer(45f, 0f, 0f, Color.rgb(0, 170, 255))
        canvas.drawCircle(cx, cy, radius, paint)

        paint.strokeWidth = 3f
        paint.color = Color.rgb(210, 90, 255)
        paint.setShadowLayer(28f, 0f, 0f, Color.rgb(210, 90, 255))
        canvas.drawCircle(cx, cy, radius * 1.18f, paint)

        paint.clearShadowLayer()

        t += 0.045f
        postInvalidateOnAnimation()
    }
}
''')

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "targetSdk = 35\n",
                  """targetSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
"""
              )

          if "jvmToolchain" not in s:
              s += "\n\nkotlin {\n    jvmToolchain(17)\n}\n"

          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonam-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
