name: Build Sonam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir project
          unzip -q Sonam-AI-Voice-Assistant-starter.zip -d project

      - name: Fix NeonView
        run: |
          sed -i 's/import android.content.Context/import android.content.Context\nimport android.util.AttributeSet/' project/app/src/main/java/com/sonam/assistant/NeonView.kt
          sed -i 's/class NeonView(context: Context) : View(context) {/class NeonView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null, defStyleAttr: Int = 0) : View(context, attrs, defStyleAttr) {/' project/app/src/main/java/com/sonam/assistant/NeonView.kt

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {\n",
              "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n",
              1
          )
          if "jvmToolchain" not in s:
              s += "\n\nkotlin {\n    jvmToolchain(17)\n}\n"
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
